    var doc=new DOMParser().parseFromString(_h,"text/html");
    // Replace <head> contents (title, meta, styles, links)
    document.head.innerHTML=doc.head.innerHTML;
    // Replace <body> contents
    document.body.innerHTML=doc.body.innerHTML;
    // Re-execute scripts (innerHTML doesn't run them)
    doc.querySelectorAll("script").forEach(function(old){
      var s=document.createElement("script");
      for(var i=0;i<old.attributes.length;i++){var a=old.attributes[i];s.setAttribute(a.name,a.value);}
      s.text=old.textContent||"";
      document.body.appendChild(s);
    });
    // Ensure title is set even if source had none
    var t=doc.querySelector("title");
    if(t)document.title=t.textContent||"";
  }catch(e){document.open();document.write(_h);document.close();}
}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",render);}else{render();}
})();
</script></body></html>
